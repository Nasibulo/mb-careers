<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Анкета кандидата — Murad Buildings</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ФИРМЕННЫЙ СТИЛЬ — по брендбуку Murad Buildings (2025).
     Цвета менять нельзя (брендбук, стр. 59).
     ============================================================ */
  :root {
    /* Основная палитра */
    --gold:      #D1AE6C;   /* Золотистый бежевый, Pantone 7403 C */
    --indigo:    #3E4095;   /* Индиго, Pantone 2746 C */
    /* Второстепенная палитра */
    --navy:      #0B1948;   /* Тёмно-синий — вместо чёрного, Pantone 2768 C */
    --warm:      #F2F0EC;   /* Тёплый серо-белый — вместо белого, Warm Gray 1 C */
    --lilac:     #BFBCF3;   /* Светло-сиреневый — акцент «love», Pantone 291 C */

    --bg:        var(--warm);
    --card:      #FFFFFF;
    --ink:       var(--navy);
    --muted:     #676F8A;   /* тёмно-синий, ослабленный для подписей */
    --line:      #DADCE4;
    --error:     #B3412E;   /* служебный цвет только для ошибок */

    /* Шрифт — Montserrat: бесплатная замена Gotham Pro (по решению HR).
       В брендбуке основной — Gill Sans. Gotham Pro лежит в brand/fonts/ —
       его можно вернуть, когда анкета переедет на сервер компании с лицензией. */
    --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; position: relative; }

  /* Заголовки: только прописные, плотный трекинг (брендбук, стр. 68–69) */
  .caps {
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  /* ---------- Шапка ---------- */
  .hero {
    background: var(--indigo);
    color: var(--warm);
    padding: 28px 20px 76px;
    position: relative;
    overflow: hidden;
  }
  .logo { display: block; width: 92px; height: auto; color: #FFFFFF; }
  .hero h1 { font-size: 34px; margin: 30px 0 12px; color: var(--warm); }
  .hero p { margin: 0; font-size: 15px; max-width: 440px; color: var(--warm); }
  /* Паттерн из сердечек: два ряда вдоль нижнего края (брендбук, стр. 49) */
  .pattern {
    position: absolute; left: 0; right: 0; bottom: 14px;
    width: 100%; height: 40px;
    color: var(--lilac); opacity: .45;
  }

  /* ---------- Прогресс ---------- */
  .progress { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 3px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }

  main { padding: 16px 16px 32px; }

  /* ---------- Карточки-разделы ---------- */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 18px 6px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 17px;
    margin: 0 0 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .heart { width: 16px; height: auto; flex: none; color: var(--gold); }

  /* ---------- Поля ---------- */
  .field { margin-bottom: 18px; }
  .field > label, .field > .label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 7px; }
  .req { color: var(--indigo); }
  .opt { color: var(--muted); font-weight: 400; }
  input, textarea {
    width: 100%;
    font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s, background .15s;
    -webkit-appearance: none;
  }
  input::placeholder, textarea::placeholder { color: #A3A8BA; }
  input:focus, textarea:focus { border-color: var(--indigo); background: var(--card); }
  textarea { resize: vertical; min-height: 96px; }
  .phone { display: flex; align-items: stretch; }
  .phone .prefix {
    display: flex; align-items: center;
    padding: 0 12px;
    border: 1px solid var(--line); border-right: 0;
    border-radius: 10px 0 0 10px;
    font-weight: 600;
  }
  .phone input { border-radius: 0 10px 10px 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .error-text { font-size: 13px; color: var(--error); margin-top: 6px; display: none; }
  .field.invalid input, .field.invalid textarea { border-color: var(--error); }
  .field.invalid .error-text { display: block; }

  /* Варианты-«чипы»: удобнее выпадающих списков на телефоне */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 9px 15px;
    font: inherit; font-size: 14px; color: var(--ink);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .chip[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: #FFFFFF; }
  .field.invalid .chips .chip { border-color: var(--error); }

  /* ---------- Контакты HR ---------- */
  .contact { display: flex; gap: 14px; align-items: center; padding-bottom: 16px; }
  .avatar {
    width: 52px; height: 52px; flex: none;
    border-radius: 50%;
    background: var(--lilac); color: var(--navy);
    display: grid; place-items: center;
    font-size: 19px; font-weight: 600;
  }
  .contact b { display: block; font-size: 16px; }
  .contact small { display: block; color: var(--muted); font-size: 14px; }
  .links { display: grid; gap: 8px; padding-bottom: 18px; }
  .links a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
    color: var(--ink); text-decoration: none; font-size: 15px;
  }
  .links a { flex-direction: column; align-items: flex-start; gap: 2px; }
  .links a b { font-weight: 500; }
  .links a span { color: var(--muted); font-size: 14px; }

  /* ---------- Согласие и кнопка ---------- */
  .note { font-size: 13px; color: var(--muted); margin: 6px 4px 16px; }
  .submit {
    width: 100%;
    border: 0; border-radius: 12px;
    background: var(--indigo); color: #FFFFFF;
    font: inherit; font-size: 16px; font-weight: 600;
    padding: 17px;
    cursor: pointer;
  }
  .submit:active { transform: translateY(1px); }

  /* ---------- Экран «Спасибо» (виден при просмотре вне Telegram) ---------- */
  .done {
    display: none;
    min-height: 100vh;
    background: var(--indigo); color: var(--warm);
    padding: 72px 28px;
    text-align: center;
    position: relative; overflow: hidden;
  }
  .done .logo { margin: 0 auto 40px; width: 110px; }
  .done h2 { font-size: 34px; margin: 0 0 12px; }
  .done p { margin: 0 auto; max-width: 320px; font-size: 16px; }
  .slogan { margin-top: 48px; font-size: 20px; display: inline-flex; align-items: center; gap: 10px; }
  .slogan .heart { width: 20px; }
  .done .pattern { bottom: 24px; }
  body.sent main, body.sent .hero, body.sent .progress { display: none; }
  body.sent .done { display: block; }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 486.1 474.0" role="img" aria-label="Murad Buildings"><use href="#logo"/></svg>
    <h1 class="caps" data-t="title"></h1>
    <p data-t="subtitle"></p>
  </div>
  <svg class="pattern" aria-hidden="true"><rect width="100%" height="100%" fill="url(#hearts)"/></svg>
</div>
<div class="progress"><span id="bar"></span></div>

<main>
  <div class="wrap">
    <form id="form" novalidate>

      <!-- Личные данные -->
      <section class="card">
        <h2 class="caps"><svg class="heart" viewBox="0 0 159.0 128.7"><use href="#heart"/></svg><span data-t="s_personal"></span></h2>

        <div class="field" data-required>
          <label for="name"><span data-t="name"></span> <span class="req">*</span></label>
          <input id="name" name="name" maxlength="100" autocomplete="name">
          <div class="error-text" data-t="err_required"></div>
        </div>

        <div class="field" data-required>
          <label for="phone"><span data-t="phone"></span> <span class="req">*</span></label>
          <div class="phone">
            <span class="prefix">+998</span>
            <input id="phone" name="phone" inputmode="numeric" placeholder="90 123 45 67" maxlength="12" autocomplete="tel-national">
          </div>
          <div class="error-text" data-t="err_phone"></div>
        </div>

        <div class="field">
          <label for="age"><span data-t="age"></span> <span class="opt" data-t="optional"></span></label>
          <input id="age" name="age" inputmode="numeric" maxlength="2">
        </div>

        <div class="field">
          <label for="city" data-t="city"></label>
          <input id="city" name="city" maxlength="80">
        </div>
      </section>

      <!-- Опыт и пожелания -->
      <section class="card">
        <h2 class="caps"><svg class="heart" viewBox="0 0 159.0 128.7"><use href="#heart"/></svg><span data-t="s_work"></span></h2>

        <div class="field" data-required>
          <label for="position"><span data-t="position"></span> <span class="req">*</span></label>
          <input id="position" name="position" maxlength="100">
          <div class="error-text" data-t="err_required"></div>
        </div>

        <div class="field" data-required data-chips="exp">
          <div class="label"><span data-t="exp"></span> <span class="req">*</span></div>
          <div class="chips" data-options="exp"></div>
          <div class="error-text" data-t="err_choose"></div>
        </div>

        <div class="field">
          <label for="last_job" data-t="last_job"></label>
          <input id="last_job" name="last_job" maxlength="150">
          <div class="hint" data-t="last_job_hint"></div>
        </div>

        <div class="field" data-chips="edu">
          <div class="label" data-t="edu"></div>
          <div class="chips" data-options="edu"></div>
        </div>

        <div class="field">
          <label for="salary"><span data-t="salary"></span> <span class="opt" data-t="optional"></span></label>
          <input id="salary" name="salary" maxlength="40">
        </div>
      </section>

      <!-- Дополнительно -->
      <section class="card">
        <h2 class="caps"><svg class="heart" viewBox="0 0 159.0 128.7"><use href="#heart"/></svg><span data-t="s_more"></span></h2>

          <div class="chips" data-options="langs"></div>

        <div class="field">
          <label for="about" data-t="about"></label>
          <textarea id="about" name="about" maxlength="500"></textarea>
          <div class="hint" data-t="about_hint"></div>

      <!-- Контакты HR -->
      <section class="card">
        <h2 class="caps"><svg class="heart" viewBox="0 0 159.0 128.7"><use href="#heart"/></svg><span data-t="s_contacts"></span></h2>
        <div class="contact">
          <div class="avatar" id="c_initials"></div>
          <div><b id="c_name"></b><small id="c_role"></small><small id="c_hours"></small></div>

<script>
/* ============================================================

   ============================================================ */
const CONTACTS = {
  name: { ru: "Насибулло Рахимжонов", uz: "Nasibullo Raximjonov", en: "Nasibullo Raximjonov" },

  // Поиск офиса на карте

/* ============================================================
   ТЕКСТЫ НА ТРЁХ ЯЗЫКАХ
   Правила брендбука: обращение на «вы» со строчной буквы,
   в o‘ и g‘ только апостроф ‘, валюта словом «сум», не кодом.
   ============================================================ */
const TEXTS = {
  ru: {
    title: "Анкета кандидата",
    subtitle: "Нет резюме? Заполните анкету — это займёт 3 минуты. Мы свяжемся с вами, если ваш опыт подойдёт под открытые вакансии.",
    s_personal: "Личные данные", s_work: "Опыт и пожелания", s_more: "Дополнительно", s_contacts: "Контакты HR",
    name: "ФИО", phone: "Телефон", age: "Возраст", optional: "— необязательно", city: "Город / район проживания",
    position: "Желаемая должность", exp: "Опыт работы",
    last_job: "Последнее место работы и должность", last_job_hint: "Например: «ООО Строй, прораб»",
    edu: "Образование", salary: "Ожидаемая зарплата, сум",
    langs: "Какими языками владеете", about: "О себе", about_hint: "Ключевые навыки, достижения — до 500 символов",
    err_required: "Заполните это поле", err_phone: "Введите 9 цифр номера, например 90 123 45 67", err_choose: "Выберите вариант",
    c_phone: "Позвонить", c_tg: "Написать в Telegram", c_email: "Написать на почту", c_office: "Офис — открыть на карте",
    consent_note: "Отправляя анкету, вы подтверждаете согласие на обработку персональных данных в целях подбора персонала.",
    submit: "Отправить анкету",
    done_title: "Спасибо!", done_text: "Анкета отправлена. Мы свяжемся с вами.",
    slogan: "Любить и быть любимыми!",
    exp_opts: { "0": "Без опыта", "<1": "До 1 года", "1-3": "1–3 года", "3-5": "3–5 лет", "5+": "Более 5 лет" },
    edu_opts: { school: "Среднее", college: "Среднее специальное", bachelor_inc: "Неоконченное высшее", higher: "Высшее" },
    langs_opts: { ru: "Русский", uz: "Узбекский", en: "Английский", other: "Другой" },
  },
  uz: {
    title: "Nomzod anketasi",
    subtitle: "Rezyumengiz yo‘qmi? Anketani to‘ldiring — bu 3 daqiqa vaqt oladi. Tajribangiz ochiq vakansiyalarga mos kelsa, siz bilan bog‘lanamiz.",
    s_personal: "Shaxsiy ma’lumotlar", s_work: "Tajriba va istaklar", s_more: "Qo‘shimcha", s_contacts: "HR kontaktlari",
    name: "F.I.Sh.", phone: "Telefon", age: "Yosh", optional: "— ixtiyoriy", city: "Yashash shahri / tumani",
    position: "Istalgan lavozim", exp: "Ish tajribasi",
    last_job: "Oxirgi ish joyi va lavozim", last_job_hint: "Masalan: «Stroy MChJ, prorab»",
    edu: "Ma’lumot", salary: "Kutilayotgan maosh, so‘m",
    langs: "Qaysi tillarni bilasiz", about: "O‘zingiz haqingizda", about_hint: "Asosiy ko‘nikmalar, yutuqlar — 500 belgigacha",
    err_required: "Ushbu maydonni to‘ldiring", err_phone: "Raqamning 9 ta raqamini kiriting, masalan 90 123 45 67", err_choose: "Variantni tanlang",
    c_phone: "Qo‘ng‘iroq qilish", c_tg: "Telegramda yozish", c_email: "Pochtaga yozish", c_office: "Ofis — xaritada ochish",
    consent_note: "Anketani yuborish orqali siz xodimlarni tanlash maqsadida shaxsiy ma’lumotlaringizni qayta ishlashga rozilik bildirasiz.",
    submit: "Anketani yuborish",
    done_title: "Rahmat!", done_text: "Anketa yuborildi. Siz bilan bog‘lanamiz.",
    slogan: "",   // официального узбекского слогана в брендбуке нет
    exp_opts: { "0": "Tajribasiz", "<1": "1 yilgacha", "1-3": "1–3 yil", "3-5": "3–5 yil", "5+": "5 yildan ortiq" },
    edu_opts: { school: "O‘rta", college: "O‘rta maxsus", bachelor_inc: "Tugallanmagan oliy", higher: "Oliy" },
    langs_opts: { ru: "Rus tili", uz: "O‘zbek tili", en: "Ingliz tili", other: "Boshqa" },
  },
  en: {
    title: "Candidate form",
    subtitle: "No CV? Fill in this form — it takes 3 minutes. We will contact you if your experience matches our open vacancies.",
    s_personal: "Personal details", s_work: "Experience & preferences", s_more: "Additional", s_contacts: "HR contacts",
    name: "Full name", phone: "Phone", age: "Age", optional: "— optional", city: "City / district of residence",
    position: "Desired position", exp: "Work experience",
    last_job: "Last workplace and position", last_job_hint: "For example: “Stroy LLC, site manager”",
    edu: "Education", salary: "Expected salary, sum",
    langs: "Languages you speak", about: "About you", about_hint: "Key skills, achievements — up to 500 characters",
    err_required: "Please fill in this field", err_phone: "Enter 9 digits, e.g. 90 123 45 67", err_choose: "Please choose an option",
    c_phone: "Call", c_tg: "Message on Telegram", c_email: "Send an email", c_office: "Office — open on map",
    consent_note: "By submitting the form you consent to the processing of your personal data for recruitment purposes.",
    submit: "Submit form",
    done_title: "Thank you!", done_text: "Your form has been sent. We will contact you.",
    slogan: "Love and be loved!",
    exp_opts: { "0": "No experience", "<1": "Under 1 year", "1-3": "1–3 years", "3-5": "3–5 years", "5+": "Over 5 years" },
    edu_opts: { school: "Secondary", college: "Vocational", bachelor_inc: "Incomplete higher", higher: "Higher" },
    langs_opts: { ru: "Russian", uz: "Uzbek", en: "English", other: "Other" },
  },
};

/* ============================================================
   ЛОГИКА СТРАНИЦЫ
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);   // открыта ли анкета внутри Telegram

// Язык приходит от бота в ссылке: ...index.html?lang=uz
const params = new URLSearchParams(location.search);
const lang = TEXTS[params.get("lang")] ? params.get("lang") : "ru";
const T = TEXTS[lang];
document.documentElement.lang = lang;
document.title = T.title + " — Murad Buildings";

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#3E4095"); tg.setBackgroundColor("#F2F0EC"); } catch (e) {}
}

// Подставляем тексты
document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });
if (!T.slogan) document.getElementById("slogan").remove();

// Варианты-чипы
const chosen = { exp: [], edu: [], langs: [] };
document.querySelectorAll("[data-options]").forEach(box => {
  const key = box.dataset.options;
  const multi = box.closest(".field").hasAttribute("data-multi");
  Object.entries(T[key + "_opts"]).forEach(([value, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      if (multi) {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", on);
        chosen[key] = on ? [...chosen[key], value] : chosen[key].filter(v => v !== value);
      } else {
        box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        chosen[key] = [value];
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      box.closest(".field").classList.remove("invalid");
      updateProgress();
    };
    box.appendChild(b);
  });
});

// Контакты HR
const initials = CONTACTS.name[lang].split(" ").map(w => w[0]).join("").slice(0, 2);
document.getElementById("c_initials").textContent = initials;
document.getElementById("c_name").textContent = CONTACTS.name[lang];
document.getElementById("c_role").textContent = CONTACTS.role[lang];
document.getElementById("c_hours").textContent = CONTACTS.hours[lang];
const links = [
  [T.c_phone, CONTACTS.phone, "tel:" + CONTACTS.phone.replace(/\s/g, "")],
  [T.c_tg, "@" + CONTACTS.telegram, "https://t.me/" + CONTACTS.telegram],
  [T.c_email, CONTACTS.email, "mailto:" + CONTACTS.email],
  [T.c_office, CONTACTS.address[lang], CONTACTS.map],
];
links.forEach(([label, value, href]) => {
  const a = document.createElement("a");
  a.href = href;
  a.innerHTML = `<b></b><span></span>`;
  a.querySelector("b").textContent = label;
  a.querySelector("span").textContent = value;
  if (tg && href.startsWith("https://t.me/")) {
    a.onclick = e => { e.preventDefault(); tg.openTelegramLink(href); };
  } else if (tg && href.startsWith("https://")) {
    a.onclick = e => { e.preventDefault(); tg.openLink(href); };   // карта откроется в браузере
  }
  document.getElementById("c_links").appendChild(a);
});

// Маска телефона: 90 123 45 67
const phone = document.getElementById("phone");
phone.addEventListener("input", () => {
  let d = phone.value.replace(/\D/g, "");
  if (d.startsWith("998") && d.length > 9) d = d.slice(3);
  d = d.slice(0, 9);
  phone.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(" ");
});
document.getElementById("age").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "");
});

// Полоса прогресса — по обязательным полям
const requiredFields = [...document.querySelectorAll("[data-required]")];
function isFilled(field) {
  if (field.dataset.chips) return chosen[field.dataset.chips].length > 0;
  const input = field.querySelector("input, textarea");
  if (input.id === "phone") return input.value.replace(/\D/g, "").length === 9;
  return input.value.trim().length > 0;
}
function updateProgress() {
  const done = requiredFields.filter(isFilled).length;
  document.getElementById("bar").style.width = (done / requiredFields.length * 100) + "%";
}
document.getElementById("form").addEventListener("input", e => {
  e.target.closest(".field")?.classList.remove("invalid");
  updateProgress();
});

// Отправка
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  let firstBad = null;
  requiredFields.forEach(f => {
    const ok = isFilled(f);
    f.classList.toggle("invalid", !ok);
    if (!ok && !firstBad) firstBad = f;
  });
  if (firstBad) {
    firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }

  const val = id => document.getElementById(id).value.trim();
  const data = {
    type: "form", lang,
    name: val("name"),
    phone: "+998" + phone.value.replace(/\D/g, ""),
    age: val("age"),
    city: val("city"),
    position: val("position"),
    exp: chosen.exp[0] || "",
    last_job: val("last_job"),
    edu: chosen.edu[0] || "",
    salary: val("salary"),
    langs: chosen.langs,
    about: val("about"),
  };

  if (inTelegram) {
    tg.sendData(JSON.stringify(data));   // данные уходят боту, окно закрывается
  } else {
    console.log("Анкета (просмотр вне Telegram):", data);
    document.body.classList.add("sent");
    window.scrollTo(0, 0);
  }
});

updateProgress();
</script>
